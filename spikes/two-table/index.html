<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>两表布局技术验证</title>
<style>
*{box-sizing:border-box}body{font:14px system-ui;margin:24px;color:#26364a}#root{width:900px;border:1px solid #ccd4df;--x:0px;--r:0px}.head{overflow:hidden;background:#edf2f8}.body{height:430px;overflow:auto}.canvas{position:relative;width:1440px;height:3600000px}table{table-layout:fixed;border-collapse:separate;border-spacing:0;width:1440px}td,th{height:36px;padding:0 12px;border-right:1px solid #ccd4df;border-bottom:1px solid #ccd4df;white-space:nowrap;background:white}[data-fixed=left]{position:relative;transform:translate3d(var(--x),0,0);z-index:3;background:#edf2f8}[data-fixed=right]{position:relative;transform:translate3d(var(--r),0,0);z-index:3;background:#edf2f8}th{background:#edf2f8}.pinned td{background:#e7f7f1}.merge{position:absolute;left:120px;width:120px;height:3600px;background:#e9f3ff;border:1px solid #b5c7df;pointer-events:none}.content{display:flex;align-items:center;padding:10px}.spacer td{padding:0;border:0}.popup{position:fixed;background:#fff;box-shadow:0 4px 24px #0003;padding:16px;z-index:10}
</style>
<h1>两表布局 / 100,000 行验证</h1><p>横向滚动以主体为唯一来源。绿色行为头表中的固定对比行。</p>
<div id="root"><div class="head"><table><colgroup></colgroup><thead><tr></tr></thead><tbody class="pinned"><tr></tr></tbody></table></div><div class="body"><div class="canvas"><table><colgroup></colgroup><tbody></tbody></table><div class="merges"></div></div></div></div>
<script type="module">
const root=document.querySelector('#root'),head=document.querySelector('.head'),ht=head.querySelector('table'),body=document.querySelector('.body'),tbody=body.querySelector('tbody'),merges=document.querySelector('.merges');
for(let c=0;c<12;c++){for(const cg of document.querySelectorAll('colgroup')){const col=document.createElement('col');col.style.width='120px';cg.append(col)}for(const [tr,tag] of [[head.querySelector('thead tr'),'th'],[head.querySelector('tbody tr'),'td']]){const cell=document.createElement(tag);cell.textContent=tag==='th'?`列 ${c+1}`:`对比 ${c+1}`;if(c===0)cell.dataset.fixed='left';if(c===11)cell.dataset.fixed='right';tr.append(cell)}}
let lastStart=-1;
function render(){const start=Math.max(0,Math.floor(body.scrollTop/36)-8),end=Math.min(100000,start+32);if(start!==lastStart){lastStart=start;const frag=document.createDocumentFragment();function spacer(h){const tr=document.createElement('tr');tr.className='spacer';const td=document.createElement('td');td.colSpan=12;td.style.height=`${h}px`;tr.append(td);frag.append(tr)}spacer(start*36);for(let r=start;r<end;r++){const tr=document.createElement('tr');tr.dataset.row=r;for(let c=0;c<12;c++){const td=document.createElement('td');td.textContent=c===1?'':`${r+1} / ${c+1}`;if(c===0)td.dataset.fixed='left';if(c===11)td.dataset.fixed='right';tr.append(td)}frag.append(tr)}spacer((100000-end)*36);tbody.replaceChildren(frag)}merges.replaceChildren();for(let g=Math.floor(start/100);g<=Math.floor(end/100);g++){const top=g*3600,bottom=top+3600,vt=Math.max(top,body.scrollTop),vb=Math.min(bottom,body.scrollTop+body.clientHeight);if(vb<=vt)continue;const el=document.createElement('div');el.className='merge';el.style.top=`${top}px`;const text=document.createElement('div');text.className='content';text.textContent=`合并块 ${g}`;text.style.transform=`translate3d(0,${vt-top}px,0)`;text.style.height=`${vb-vt}px`;el.append(text);merges.append(el)}}
function sync(){const x=body.scrollLeft;ht.style.transform=`translate3d(${-x}px,0,0)`;root.style.setProperty('--x',`${x}px`);root.style.setProperty('--r',`${x+body.clientWidth-1440}px`);head.style.width=`${body.clientWidth}px`;render()}
body.addEventListener('scroll',sync,{passive:true});new ResizeObserver(sync).observe(body);sync();window.spike={hit:(x,y)=>({row:Math.floor((y+body.scrollTop)/36),column:Math.floor((x+body.scrollLeft)/120)}),sync};
</script></html>
